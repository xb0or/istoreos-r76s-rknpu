name: Build iStoreOS for NanoPi R76S (rknpu enabled)

# 用途：在 GitHub 托管的 runner 上编译 iStoreOS 固件（rockchip/armv8 + R76S），
# 默认启用 Rockchip NPU 内核模块（kmod-rknpu），并去掉开机 blacklist。
#
# 触发方式：手动 Run workflow，或 push 到 main。
# 产物：Actions 页面 artifact "istoreos-r76s-rknpu" 里的 *.img.gz（sysupgrade 与 factory）。

on:
  workflow_dispatch:
    inputs:
      istoreos_ref:
        description: "iStoreOS 分支/tag"
        required: false
        default: istoreos-25.12
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-istoreos-r76s.yml"
      - "configs/**"
      - "scripts/**"

env:
  ISTOREOS_REPO: https://github.com/istoreos/istoreos.git
  ISTOREOS_REF: ${{ github.event.inputs.istoreos_ref || 'istoreos-25.12' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/google
          sudo apt-get clean
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pkg-resources \
            python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          df -h / | tail -1

      - name: Clone iStoreOS (${{ env.ISTOREOS_REF }})
        run: |
          git clone --depth=1 -b "$ISTOREOS_REF" "$ISTOREOS_REPO" openwrt
          cd openwrt
          git log --oneline -1

      - name: Offload heavy dirs to /mnt
        run: |
          set -e
          echo "--- before ---"
          df -h / /mnt 2>/dev/null | tail -4
          avail=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "/mnt available: ${avail:-0}G"
          if [ "${avail:-0}" -ge 20 ]; then
            sudo mkdir -p /mnt/openwrt-dl /mnt/openwrt-build
            sudo chown -R "$USER":"$USER" /mnt/openwrt-dl /mnt/openwrt-build
            rm -rf openwrt/dl openwrt/build_dir
            ln -s /mnt/openwrt-dl openwrt/dl
            ln -s /mnt/openwrt-build openwrt/build_dir
            echo "offloaded dl and build_dir to /mnt"
          else
            mkdir -p openwrt/dl openwrt/build_dir
            echo "WARN: /mnt is small, keeping dirs on root fs"
          fi
          echo "--- after ---"
          df -h / /mnt 2>/dev/null | tail -4
          ls -ld openwrt/dl openwrt/build_dir

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable rknpu by default (dkml kmods)
        run: |
          cd openwrt
          bash ../scripts/patch-kmods.sh

      - name: Configure (target + device + kmod-rknpu + LuCI)
        run: bash scripts/configure.sh

      - name: Download package sources
        run: |
          cd openwrt
          if ! make download -j"$(nproc)" > download.log 2>&1; then
            echo "=== download failed, last 120 lines ==="
            tail -120 download.log
            exit 1
          fi

      - name: Build firmware
        run: |
          cd openwrt
          echo "start: $(date -u +%H:%M:%S)"
          if ! make -j"$(nproc)" > build.log 2>&1; then
            echo "=== BUILD FAILED at $(date -u +%H:%M:%S) ==="
            df -h / | tail -2
            echo "--- error lines (last 60) ---"
            grep -n -iE "error:|Error [0-9]|failed|No space left|Killed|undefined reference" build.log | tail -60
            echo "--- last 150 lines ---"
            tail -150 build.log
            exit 1
          fi
          echo "done: $(date -u +%H:%M:%S)"
          ls -la bin/targets/rockchip/armv8/ || true

      - name: Summarize artifacts
        if: always()
        run: |
          echo "### 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh openwrt/bin/targets/rockchip/armv8/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no output dir" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### 关键配置" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "kmod-rknpu|DEVICE_friendlyarm_nanopi-r76s|^CONFIG_PACKAGE_luci=y" openwrt/.config >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -2000 openwrt/build.log > build-tail.log 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-r76s-rknpu
          path: |
            openwrt/bin/targets/rockchip/armv8/*.img.gz
            openwrt/bin/targets/rockchip/armv8/profiles.json
            openwrt/.config
            build-tail.log
            openwrt/build.log
          if-no-files-found: warn
          retention-days: 30
